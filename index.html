<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Tic-Tac-Toe</h1>

        <div id="playerSetup" class="name-inputs">
            <input type="text" id="player1NameInput" placeholder="Enter Player 1 Name (X)">
            <input type="text" id="player2NameInput" placeholder="Enter Player 2 Name (O)">
            <button id="startGameButton">Start Game</button>
        </div>

        <p id="assignmentsDisplay" class="assignments"></p>

        <div id="gameSection" style="display: none;"> <div class="game-board" id="gameBoard">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>

            <p id="gameStatus" class="status">Enter names and click Start Game</p>
        </div>

        ---

        <div class="scoreboard">
            <h3>Scoreboard</h3>
            <p><span id="player1NameDisplay">Player 1</span>: <span id="scorePlayer1">0</span></p>
            <p><span id="player2NameDisplay">Player 2</span>: <span id="scorePlayer2">0</span></p>
        </div>

        <button id="restartGameButton">Restart Game</button>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
